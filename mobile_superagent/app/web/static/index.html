<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>手机助手控制台</title>
<style>
  body{font-family:system-ui,sans-serif;max-width:760px;margin:0 auto;padding:20px;background:#0f1115;color:#e6e6e6}
  h1{font-size:20px}
  textarea{width:100%;height:64px;background:#1a1d24;color:#fff;border:1px solid #333;border-radius:8px;padding:10px;box-sizing:border-box}
  button{background:#2563eb;color:#fff;border:0;border-radius:8px;padding:10px 18px;cursor:pointer;margin-top:8px}
  button:hover{background:#1d4ed8}
  .card{background:#1a1d24;border:1px solid #2a2f3a;border-radius:10px;padding:14px;margin-top:14px}
  .task{display:flex;justify-content:space-between;border-bottom:1px solid #2a2f3a;padding:8px 0;cursor:pointer}
  .badge{padding:2px 8px;border-radius:10px;font-size:12px}
  .b-running{background:#b45309}.b-done{background:#15803d}.b-failed{background:#b91c1c}
  .b-need_user{background:#d97706}.b-cancelled{background:#4b5563}.b-queued{background:#374151}
  .step{margin:6px 0;padding:6px 8px;background:#15181f;border-radius:6px;font-size:13px}
  .yellow{background:#3a2f0a;border:1px solid #8a6d1a;padding:10px;border-radius:8px;margin:10px 0}
  img{max-width:100%;border-radius:8px;margin-top:10px}
  pre{white-space:pre-wrap;font-size:12px;color:#bbb}
</style>
</head>
<body>
<h1>手机助手控制台</h1>
<div class="card">
  <textarea id="goal" placeholder="用自然语言描述要手机做的事，例如：打开抖音浏览3个视频并摘要，不要点赞评论关注"></textarea>
  <select id="device"></select>
  <button onclick="submitTask()">执行</button>
  <div id="submitMsg"></div>
</div>
<div class="card"><h3>最近任务</h3><div id="taskList">加载中...</div></div>
<div id="detail"></div>

<script>
let api = '';
async function apiFetch(p, opts){ const r=await fetch(api+p, opts); return r.json(); }

async function loadDevices(){
  const devs = await apiFetch('/api/devices');
  const sel = document.getElementById('device');
  sel.innerHTML = devs.map(d=>`<option value="${d.id}">${d.name||d.serial} (${d.status})</option>`).join('');
}

async function loadTasks(){
  const tasks = await apiFetch('/api/tasks');
  document.getElementById('taskList').innerHTML = tasks.map(t=>
    `<div class="task" onclick="openTask('${t.id}')">
       <span>${t.user_goal}</span>
       <span class="badge b-${t.status}">${t.status}</span>
     </div>`).join('') || '<div>暂无任务</div>';
}

async function submitTask(){
  const goal = document.getElementById('goal').value;
  const device = document.getElementById('device').value;
  if(!goal){document.getElementById('submitMsg').textContent='请输入目标';return;}
  const t = await apiFetch('/api/tasks', {method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({goal, device_id:device})});
  document.getElementById('submitMsg').textContent = '已创建: '+t.id;
  loadTasks();
}

async function openTask(id){
  const t = await apiFetch('/api/tasks/'+id);
  const steps = await apiFetch('/api/tasks/'+id+'/steps');
  let html = `<div class="card"><h3>${t.user_goal}</h3>
    <span class="badge b-${t.status}">${t.status}</span>`;
  if(t.status==='need_user'){
    html += `<div class="yellow">⚠ ${t.need_user_reason}<br>${t.need_user_instruction}
      <button onclick="cont('${id}')">完成处理，继续</button></div>`;
  }
  if(t.result_message) html += `<pre>${t.result_message}</pre>`;
  html += steps.map(s=>{
    const a = JSON.parse(s.action_json||'{}');
    const ss = s.screenshot_path ? `<img src="${'/screens/'+s.id}.png" onerror="this.style.display='none'">` : '';
    return `<div class="step"><b>#${s.step_no}</b> ${s.observe||''}
      <div>动作: <code>${a.type||''}</code></div>
      <pre>${s.screen_ocr? (s.screen_ocr||'').substring(0,200):''}</pre>${ss}</div>`;
  }).join('');
  html += '</div>';
  document.getElementById('detail').innerHTML = html;
}

async function cont(id){
  await apiFetch('/api/tasks/'+id+'/continue', {method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});
  openTask(id);
}

loadDevices(); loadTasks();
setInterval(loadTasks, 3000);
</script>
</body>
</html>
