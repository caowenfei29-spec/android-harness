{% extends "base.html" %}

{% block content %}
<div class="card">
  <div class="card-header row-between">
    <h2>已连接设备</h2>
    <div class="row">
      <button class="btn ghost" id="btn-scan">扫描 adb 设备</button>
      <button class="btn ghost" id="btn-reload-devices-page">刷新</button>
    </div>
  </div>
  <div id="devices-table" class="table-wrap">
    <div class="muted">加载中...</div>
  </div>
</div>

<div class="card" style="margin-top: 16px;">
  <div class="card-header">
    <h2>Wi-Fi 设备连接</h2>
  </div>
  <div class="grid-2" style="align-items: end;">
    <label class="field">
      <span>设备 IP 地址</span>
      <input id="wifi-ip" type="text" placeholder="192.168.1.100" />
    </label>
    <label class="field">
      <span>端口</span>
      <input id="wifi-port" type="number" value="5555" />
    </label>
    <div class="row" style="align-items: end;">
      <button class="btn primary" id="btn-wifi-connect">连接</button>
    </div>
  </div>
  <div id="wifi-result" class="muted" style="margin-top: 8px;"></div>
</div>

<div class="card" style="margin-top: 16px;">
  <div class="card-header">
    <h2>实时预览</h2>
  </div>
  <div class="grid-2">
    <label class="field">
      <span>选择设备</span>
      <select id="preview-device-id"></select>
    </label>
    <div class="row" style="align-items: end;">
      <button class="btn primary" id="btn-preview">获取当前截图</button>
    </div>
  </div>
  <div class="screenshot-wrap" style="margin-top: 12px;">
    <img id="preview-shot" class="screenshot hidden" alt="preview" />
    <div id="preview-empty" class="empty">选择设备后获取截图</div>
  </div>
  <pre id="preview-meta" class="code-block" style="margin-top: 12px;">-</pre>
</div>
{% endblock %}

{% block scripts %}
<script>
  document.addEventListener("DOMContentLoaded", () => {
    DevicesPage.init();
  });
</script>
{% endblock %}
