name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (no deps, stdlib only)
        run: pip install -e . --no-deps
      - name: Compile all modules
        run: python -m compileall -q src
      - name: CLI loads
        run: python -m android_harness.run --help
      - name: Install dev test dep (pytest, not a runtime dep)
        run: pip install pytest
      - name: uiautomator parser round-trips a sample dump
        run: python -m pytest tests/ -q
      - name: Basic lint (syntax + unused-import light check)
        run: python -m py_compile src/android_harness/*.py
