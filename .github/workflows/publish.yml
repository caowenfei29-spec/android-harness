name: Publish to PyPI

on:
  release:
    types: [published]

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    # Only runs when a PyPI API token secret is configured. Without it the job
    # is skipped (not failed), so tagging without publishing doesn't break CI.
    # Add PYPI_API_TOKEN under Settings -> Secrets before your first release.
    if: ${{ secrets.PYPI_API_TOKEN != '' }}
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build wheel + sdist
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
